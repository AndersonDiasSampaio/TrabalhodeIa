spring.application.name=sistema-login
server.port=8080
server.forward-headers-strategy=framework

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Banco de Dados H2 em Memória
SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DBNAME}
spring.datasource.password=${BD}
#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
default.user.username=${DEFAULT_USER_USERNAME}
default.user.password=${DEFAULT_USER_PASSWORD}
default.user.role=${DEFAULT_USER_ROLE:}
# Console H2
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
spring.h2.console.path=/h2-console

# Logs
logging.level.org.springframework.security=INFO