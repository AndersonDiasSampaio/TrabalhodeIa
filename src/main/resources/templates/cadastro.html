<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Nova Conta | Sistema Seguro</title>
    <meta name="description" content="Cadastro de novo usuário com criptografia de senha e banco de dados H2">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Efeitos de iluminação ambiente no fundo -->
    <div class="ambient-glow">
        <div class="glow-circle-1"></div>
        <div class="glow-circle-2"></div>
        <div class="glow-circle-3"></div>
    </div>

    <main class="auth-wrapper">
        <div class="auth-card" style="max-width: 500px;">
            <!-- Cabeçalho do Card -->
            <div class="auth-header">
                <div class="brand-badge">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                </div>
                <h1 class="auth-title">Criar Nova Conta</h1>
                <p class="auth-subtitle">Cadastre-se para acessar as áreas restritas do sistema</p>
            </div>

            <!-- Formulário de Cadastro -->
            <form th:action="@{/cadastro}" th:object="${usuarioDTO}" method="post">
                <!-- Campo Nome Completo -->
                <div class="form-group">
                    <label for="nomeCompleto" class="form-label">Nome Completo</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </span>
                        <input type="text" id="nomeCompleto" th:field="*{nomeCompleto}" class="form-control" placeholder="ex: Maria Silva" required autofocus>
                    </div>
                    <div th:if="${#fields.hasErrors('nomeCompleto')}" class="form-error" style="color: #fda4af; font-size: 0.82rem; margin-top: 0.35rem;" th:errors="*{nomeCompleto}"></div>
                </div>

                <!-- Campo Nome de Usuário (Login) -->
                <div class="form-group">
                    <label for="username" class="form-label">Nome de Usuário (Login)</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </span>
                        <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="ex: mariasilva" required>
                    </div>
                    <div th:if="${#fields.hasErrors('username')}" class="form-error" style="color: #fda4af; font-size: 0.82rem; margin-top: 0.35rem;" th:errors="*{username}"></div>
                </div>

                <!-- Campo Senha -->
                <div class="form-group">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </span>
                        <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Mínimo de 6 caracteres" required>
                    </div>
                    <div th:if="${#fields.hasErrors('password')}" class="form-error" style="color: #fda4af; font-size: 0.82rem; margin-top: 0.35rem;" th:errors="*{password}"></div>
                </div>

                <!-- Campo Confirmar Senha -->
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirmar Senha</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                            </svg>
                        </span>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Repita a senha" required>
                    </div>
                    <div th:if="${#fields.hasErrors('confirmPassword')}" class="form-error" style="color: #fda4af; font-size: 0.82rem; margin-top: 0.35rem;" th:errors="*{confirmPassword}"></div>
                </div>

                <!-- Botão Cadastrar -->
                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">Cadastrar e Concluir</span>
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </button>
            </form>

            <!-- Rodapé com link para voltar ao Login -->
            <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px dashed rgba(255, 255, 255, 0.1);">
                <p style="color: var(--text-muted); font-size: 0.9rem;">
                    Já possui uma conta cadastrada?
                    <a th:href="@{/login}" style="color: var(--primary-light); text-decoration: none; font-weight: 600; margin-left: 0.25rem;">Fazer Login</a>
                </p>
            </div>
        </div>
    </main>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
